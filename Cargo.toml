[package]
name = "rs-broker"
version = "1.1.0"
edition = "2024"
authors = ["daheige"]
description = "rust broker"
keywords = ["broker", "rs-broker", "rust-broker", "kafka", "kafka-mq"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/rs-god/rs-broker"
documentation = "https://docs.rs/rs-broker/"

[dependencies]
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
rdkafka = { version = "0.39.0", features = ["cmake-build", "sasl", "ssl"] }
log = "0.4.34"
env_logger = "0.11.11"
